<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { firstName: 'there', waUrl: 'https://wa.me/447783518205', count: 3 };

  componentDidMount() {
    this.qs = location.search || '';
    var lead = null, first = 'there', wa = 'https://wa.me/447783518205', leadId = '';
    try {
      lead = JSON.parse(sessionStorage.getItem('hac_lead') || 'null');
      first = sessionStorage.getItem('hac_first') || 'there';
      wa = sessionStorage.getItem('hac_wa') || wa;
      leadId = sessionStorage.getItem('hac_leadid') || '';
    } catch (e) {}

    // Direct hit without a completed form: send them to the form.
    if (!lead) { location.replace('quote.html' + this.qs); return; }

    this.setState({ firstName: first, waUrl: wa });

    // This page is only reached after a confirmed submission, so Lead is a real conversion here.
    this.track('generate_lead', { form: 'ceramic_offer', lead_id: leadId, vehicle_size: (lead && lead.size) || '', source: 'Meta Ads' });
    this.track('lead_received_view', { form: 'ceramic_offer', source: 'Meta Ads' });

    this.startCountdown();
  }

  componentWillUnmount() { if (this.timer) clearInterval(this.timer); }

  track(ev, d) { try { window.dataLayer = window.dataLayer || []; window.dataLayer.push(Object.assign({ event: ev }, d || {})); } catch (e) {} }

  startCountdown() {
    if (this.timer) clearInterval(this.timer);
    this.waOpened = false;
    var self = this;
    this.timer = setInterval(function () {
      var n = self.state.count - 1;
      if (n <= 0) { clearInterval(self.timer); self.timer = null; self.setState({ count: 0 }); self.openWa(); }
      else { self.setState({ count: n }); }
    }, 1000);
  }

  openWa = () => {
    if (this.waOpened) return;
    this.waOpened = true;
    try { sessionStorage.setItem('hac_wa_opened', '1'); } catch (e) {}
    this.track('whatsapp_open', { page: 'lead_received' });
    try { window.open(this.state.waUrl, '_blank', 'noopener'); } catch (e) {}
    this.goDone();
  }

  onWa = () => {
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
    this.waOpened = true;
    try { sessionStorage.setItem('hac_wa_opened', '1'); } catch (e) {}
    this.track('whatsapp_click', { page: 'lead_received' });
    this.goDone();
  }

  goDone() { location.assign('thank-you.html' + (this.qs || '')); }

  renderVals() {
    return { firstName: this.state.firstName, waUrl: this.state.waUrl, count: this.state.count, onWa: this.onWa };
  }
}
</script>
